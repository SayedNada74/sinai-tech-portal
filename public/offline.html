<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>غير متصل بالإنترنت | SU IT Guide</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      max-w: 420px;
      padding: 2.5rem;
      border-radius: 1.5rem;
      background: rgba(24, 24, 27, 0.8);
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.25);
      backdrop-filter: blur(16px);
      margin: 1rem;
    }
    .icon-box {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 1.25rem;
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 2.25rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: #fafafa;
    }
    p {
      font-size: 0.875rem;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      background: #7c3aed;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-box">📡</div>
    <h1>أنت حالياً بدون اتصال بالإنترنت</h1>
    <p>تم حفظ بياناتك ومستنداتك المفضلة محلياً عبر تقنية PWA. يمكنك الاستمرار في مراجعتها أو محاولة إعادة الاتصال بالشبكة.</p>
    <button class="btn" onclick="window.location.reload()">
      إعادة المحاولة 🔄
    </button>
  </div>
</body>
</html>
